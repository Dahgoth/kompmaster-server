version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompmaster
      POSTGRES_PASSWORD: kompmaster
      POSTGRES_DB: kompmaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kompmaster
      MINIO_ROOT_PASSWORD: kompmaster123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль MinIO
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
