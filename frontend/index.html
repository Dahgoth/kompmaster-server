<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>КомпМастер — Восстановленная электроника</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/pages.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
    <link rel="stylesheet" href="/src/styles/utilities.css" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-logo">
        <span class="brand brand--splash">КомпМастер</span>
      </div>
    </div>

    <div class="neon-bg" aria-hidden="true"></div>

    <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
    <aside id="drawer" class="drawer" aria-label="Меню">
      <!-- populated by Drawer component -->
    </aside>

    <header class="site-header">
      <!-- populated by Header component -->
    </header>

    <main id="app"></main>

    <footer class="footer">
      <!-- populated by Footer component -->
    </footer>

    <!-- Auth modal -->
    <div id="modalBackdrop" class="modal-backdrop hidden"></div>
    <section id="authModal" class="modal hidden" aria-modal="true" role="dialog">
      <button class="modal-close" data-action="close-auth" aria-label="Закрыть">&times;</button>
      <div id="authContent"></div>
    </section>

    <!-- Legal modal -->
    <div id="legalBackdrop" class="modal-backdrop hidden"></div>
    <section id="legalModal" class="legal-modal hidden" aria-modal="true" role="dialog">
      <button class="modal-close" data-action="close-legal" aria-label="Закрыть">&times;</button>
      <div id="legalContent"></div>
    </section>

    <!-- Generic popup -->
    <section id="popup" class="popup hidden" aria-live="polite"></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
