name: 'Extract Tag'
description: 'Extract and validate tag from GitHub event context'
inputs:
  tag:
    description: 'Tag input for workflow_call/workflow_dispatch'
    required: false
    default: ''
outputs:
  tag:
    description: 'Validated tag name'
    value: ${{ steps.extract.outputs.tag }}
runs:
  using: 'composite'
  steps:
    - name: Extract and validate tag
      id: extract
      shell: bash
      run: |
        # For tag push: github.ref_name (e.g., "v2.0.0")
        # For release event: github.event.release.tag_name
        # For workflow_call: inputs.tag
        # For workflow_dispatch: github.ref_name. The dispatch is done with
        # `--ref <tag>` so the run's ref IS the tag; there is no `tag` input,
        # and `inputs.tag` would be empty. The `*` branch below also reads
        # ref_name, so a dispatch on a tag falls there correctly.
        case "${{ github.event_name }}" in
          release) TAG="${{ github.event.release.tag_name }}" ;;
          workflow_call) TAG="${{ inputs.tag }}" ;;
          *) TAG="${{ github.ref_name }}" ;;
        esac
        if [ -z "$TAG" ]; then
          echo "::error::Tag is required" >&2
          exit 1
        fi
        # Matches the deploy trigger exactly: v<major>.<minor>.<patch>[-<pre>].
        # The optional `kompmaster-` prefix is gone — it was a fossil from
        # before include-component-in-tag: false (release-please has not cut
        # one since v2.2.0), the production-vps policy (`v*.*.*`) never
        # accepted it, and leaving it here would let a `kompmaster-` release
        # through the `release: published` trigger that the tag list no longer
        # matches. Trigger and validator must agree.
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
          echo "::error::Tag $TAG does not match vX.Y.Z[-prerelease]" >&2
          exit 1
        fi
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Extracted tag: $TAG"