name: 'Verify Push Propagation'
description: 'Verify git push has propagated to origin with linear backoff'
inputs:
  branch:
    description: 'Branch to verify'
    required: false
    default: 'main'
  max-retries:
    description: 'Maximum number of retries'
    required: false
    default: '10'
  base-interval:
    description: 'Base interval in seconds for linear backoff'
    required: false
    default: '2'
outputs:
  success:
    description: 'Whether verification succeeded'
    value: ${{ steps.verify.outputs.success }}
runs:
  using: 'composite'
  steps:
    - name: Verify push propagated
      id: verify
      shell: bash
      run: |
        MAX_RETRIES=${{ inputs.max-retries }}
        BASE_INTERVAL=${{ inputs.base-interval }}
        BRANCH=${{ inputs.branch }}

        echo "Verifying push to origin/$BRANCH (max $MAX_RETRIES retries, base interval ${BASE_INTERVAL}s)"

        for i in $(seq 1 $MAX_RETRIES); do
          # Check exit code explicitly: 0=found, 2=branch not found, other=error
          LS_REMOTE_OUT=$(git ls-remote --exit-code origin $BRANCH 2>&1)
          LS_REMOTE_EXIT=$?
          if [ $LS_REMOTE_EXIT -eq 0 ] && echo "$LS_REMOTE_OUT" | grep -q "$(git rev-parse HEAD)"; then
            echo "Push verified on attempt $i"
            echo "success=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ $LS_REMOTE_EXIT -eq 2 ]; then
            echo "Branch $BRANCH not found on origin (attempt $i), retrying..."
          else
            echo "::warning::git ls-remote failed (exit $LS_REMOTE_EXIT): $LS_REMOTE_OUT"
          fi
          SLEEP=$((BASE_INTERVAL * i))
          echo "Attempt $i/$MAX_RETRIES: commit not yet visible, waiting ${SLEEP}s..."
          sleep $SLEEP
        done

        # Final check
        LS_REMOTE_OUT=$(git ls-remote --exit-code origin $BRANCH 2>&1)
        LS_REMOTE_EXIT=$?
        if [ $LS_REMOTE_EXIT -eq 0 ] && echo "$LS_REMOTE_OUT" | grep -q "$(git rev-parse HEAD)"; then
          echo "Push verified on final check"
          echo "success=true" >> $GITHUB_OUTPUT
          exit 0
        elif [ $LS_REMOTE_EXIT -eq 2 ]; then
          echo "::error::Branch $BRANCH not found on origin"
        else
          echo "::error::git ls-remote failed (exit $LS_REMOTE_EXIT): $LS_REMOTE_OUT"
        fi

        echo "::error::Commit not visible on origin/$BRANCH after $MAX_RETRIES retries"
        echo "success=false" >> $GITHUB_OUTPUT
        exit 1