name: "Detect Changes"
description: "Detect changed files matching a pattern since the merge-base with main"
inputs:
  pattern:
    description: "ERE regex pattern to match changed files (e.g., '^backend/|^scripts/')"
    required: true
  exclude-pattern:
    description: "Optional ERE regex pattern to exclude matched files (e.g., '^frontend/terraform/')"
    required: false
    default: ""
outputs:
  # MUST be declared for the value to reach the calling workflow. A composite
  # action that writes to $GITHUB_OUTPUT without declaring `outputs:` exposes
  # nothing to the caller — `steps.<id>.outputs.changed` stays empty forever,
  # and any `if:` guard on it is permanently false.
  #
  # This exact omission made `backend`, `frontend`, `e2e`, `compose` and
  # `terraform` silently skip every real step from 2026-09-25 to 2026-09-28
  # while reporting success. See docs/incidents/2026-09-28-ci-silent-skip.md.
  changed:
    description: "'true' if any changed file matches the pattern"
    value: ${{ steps.detect.outputs.changed }}
runs:
  using: "composite"
  steps:
    - name: Detect changes
      id: detect
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
        else
          base=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          if [ -z "$base" ]; then
            git fetch --no-tags origin main
            base=$(git merge-base HEAD origin/main)
          fi
        fi
        echo "base: $base"
        # Use git diff; let errors surface so failures don't silently become "no changes"
        files=$(git diff -M --diff-filter=AM --name-only "$base"...HEAD |
          grep -E '${{ inputs.pattern }}'; grep_exit=$?)
        if [ $grep_exit -eq 2 ]; then
          echo "::error::grep failed with invalid pattern or error" >&2
          exit 1
        fi
        # grep_exit 0 = matches found, 1 = no matches (normal), both OK
        if [ -n "${{ inputs.exclude-pattern }}" ] && [ -n "$files" ]; then
          files=$(echo "$files" | grep -v -E '${{ inputs.exclude-pattern }}')
        fi
        if [ -n "$files" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "changes detected:"
          echo "$files"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No matching changes"
        fi