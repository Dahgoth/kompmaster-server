version: 2
updates:
  # ── npm ────────────────────────────────────────────────────────────────
  # Single directory "/": this is a pnpm workspace with ONE root lockfile
  # (pnpm-lock.yaml). Splitting into /backend and /frontend would emit
  # conflicting lockfile PRs that can never both merge.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    # Cap the Monday flood: extra updates are queued for the next run, not
    # dropped. 5 of 7 groups is deliberate — see the actions entry below.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps:dev)"
      include: "scope"
    # NOTE: these labels do NOT gate auto-merge. Dependabot does not attach
    # `version-update:semver-*` labels to its PRs, so `dependencies` ends up on
    # every PR — majors included — and enabling the repository's "Allow
    # auto-merge" setting would merge majors unattended. Verified on PRs
    # #88-#93, which carried only `dependencies`.
    #
    # The real gate is `.github/workflows/dependabot-automerge.yml`, which reads
    # the update class via `dependabot/fetch-metadata` and calls
    # `gh pr merge --auto` only for patch/minor. Keep this list as labelling
    # only, and do not read it as a safety control.
    labels:
      - "dependencies"
    groups:
      # Auto-merge-eligible: routine tooling, low blast radius.
      dev-routine:
        dependency-type: "development"
        update-types: ["patch", "minor"]
      prod-routine:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      # Frontend majors get their own PR: a Next.js major bump touches build
      # output, routing and the deploy contract, so it is worth reading alone.
      prod-major-frontend:
        dependency-type: "production"
        update-types: ["major"]
        patterns: ["next", "react", "react-dom", "@tanstack/*"]
      # ...and the general group explicitly excludes them, so routing does not
      # depend on group evaluation order. Observed on 2026-09-28: `next`
      # 15.5.25 -> 16.3.6 landed in prod-major-runtime (PR #95) despite being
      # listed in prod-major-frontend, and no prod-major-frontend PR was
      # produced. With the exclusion, `next` either gets its own PR or falls
      # through ungrouped as a single-package PR — both visible, instead of
      # being silently batched with express/helmet/nodemail.
      prod-major-runtime:
        dependency-type: "production"
        update-types: ["major"]
        exclude-patterns: ["next", "react", "react-dom", "@tanstack/*"]
      # Majors isolated so they arrive as their own reviewable PR and never
      # ride along with a patch. Isolation is also what makes the
      # fetch-metadata gate in dependabot-automerge.yml unambiguous: a group
      # holding both a patch and a major reports a mixed update class.
      dev-major:
        dependency-type: "development"
        update-types: ["major"]
    # No `ignore` block on purpose. Suppressing a target version (the old
    # `next: ["15.x"]`) does not pin a major — it only hides 15.x patches while
    # still proposing 16.x, which is how next 15.5.25 → 16.3.6 reached a PR
    # unlabelled as a major. The severity groups above now do that job
    # explicitly. To hold a major line indefinitely, constrain the range in the
    # relevant package.json instead (e.g. `~15.5.25`), not here.

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    # Per-ecosystem cap on simultaneously OPEN Dependabot PRs; the remainder
    # queue for the next run. 5 routine + 3 actions is ~2-4 PRs in a typical
    # week, so 5 leaves headroom without letting a bad Monday bury the queue.
    # If a major ever gets deferred behind routine patches, that costs a week
    # on something that is already manual-review — an acceptable trade.
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    # Same caveat as the npm entry: these labels are cosmetic. The auto-merge
    # gate is dependabot-automerge.yml (fetch-metadata), not this list.
    labels:
      - "ci"
      - "dependencies"
    groups:
      # Split by update-type so a major action bump never shares a PR with a
      # patch, which would give the group a mixed update class and make the
      # fetch-metadata gate ambiguous. No `dependency-type` here: GitHub
      # Actions have no dev/prod split, so `update-types` is the only axis.
      actions-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Actions are pinned to SHAs spread across five workflow files, so
      # ungrouped Dependabot opens 3-5 PRs that conflict with each other on
      # the same line — checkout and setup-node both appear in
      # security-audit.yml and release.yml. One group per severity removes
      # the conflicts instead of resolving them pairwise.
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
