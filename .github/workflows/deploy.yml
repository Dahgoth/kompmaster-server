name: Deploy Production

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy-production:
    # Custom GitHub Environment for VPS production deploy (not Vercel's "Production")
    # Create in GitHub Settings → Environments → production-vps
    # Add secrets: STOREFRONT_SSH_KEY, STOREFRONT_SSH_HOST, STOREFRONT_ROOT
    # Protection rules: required reviewers (1), wait timer (5 min)
    environment: production-vps
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Tag $TAG does not match semantic version format vX.Y.Z"
            exit 1
          fi
          echo "Deploying version: $TAG"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STOREFRONT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STOREFRONT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Detect inactive color
        id: color
        run: |
          # Query the intended active color from /etc/default/caddy on the VPS
          # (source of truth for Caddy reloads). The active color is set via
          # STOREFRONT_ACTIVE_COLOR env var (blue|green). Fail if SSH fails or
          # value is unexpected.
          COLOR="blue"
          RESULT=$(ssh "${{ secrets.STOREFRONT_SSH_HOST }}" "grep '^STOREFRONT_ACTIVE_COLOR=' /etc/default/caddy 2>/dev/null | cut -d= -f2")
          if [ "$RESULT" = "green" ]; then
            COLOR="blue"
          elif [ "$RESULT" = "blue" ]; then
            COLOR="green"
          else
            echo "::error::Unexpected active color: '$RESULT' (expected blue|green)" >&2
            exit 1
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Deploying to inactive color: $COLOR"

      - name: Deploy storefront to VPS
        run: |
          STOREFRONT_SSH="root@${{ secrets.STOREFRONT_SSH_HOST }}" \
          STOREFRONT_ROOT="${{ secrets.STOREFRONT_ROOT }}" \
          ./backend/scripts/deploy-storefront.sh --skip-build --color=${{ steps.color.outputs.color }} --promote
        env:
          API_BASE: https://api.compmasone.ru/api
          SITE_URL: https://www.compmasone.ru

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Deployment (production)
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          auto-merge: false

      - name: Update Deployment Status (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          status: success
          deployment-url: https://www.compmasone.ru

      - name: Update Deployment Status (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          status: failure