name: Deploy Production

on:
  push:
    tags: ['v*.*.*', 'kompmaster-v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v2.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  deploy-production:
    # Custom GitHub Environment for VPS production deploy (not Vercel's "Production")
    # Create in GitHub Settings → Environments → production-vps
    # Add secrets: STOREFRONT_SSH_KEY, STOREFRONT_SSH_HOST, STOREFRONT_ROOT
    # Protection rules: required reviewers (1), wait timer: 0 (removed - health gates handle safety)
    environment: production-vps
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Extract and validate tag
        uses: ./.github/actions/extract-tag
        id: extract
        with:
          tag: ${{ inputs.tag }}

      - name: Generate correlation ID
        run: |
          echo "DEPLOYMENT_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "DEPLOY_START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=Deploy Started::deployment_id=${{ env.DEPLOYMENT_ID }} tag=${{ steps.extract.outputs.tag }} runner=${{ runner.name }}"

      - name: Check if already deployed (idempotency guard)
        id: idempotency
        run: |
          # Check for successful deployment instead of just release existence
          # Query GitHub Deployments API for successful deployment in production-vps
          DEPLOYMENTS=$(gh api repos/${{ github.repository }}/deployments --jq '.[] | select(.environment=="production-vps" and .ref=="${{ github.sha }}")' 2>/dev/null)
          if [ -n "$DEPLOYMENTS" ]; then
            # Get the latest deployment status
            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r '.id' | head -1)
            if [ -n "$DEPLOYMENT_ID" ] && [ "$DEPLOYMENT_ID" != "null" ]; then
              STATUS=$(gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses --jq '.[0].state' 2>/dev/null)
              if [ "$STATUS" = "success" ]; then
                echo "already_deployed=true" >> $GITHUB_OUTPUT
                echo "Deployment already successful — skipping"
                exit 0
              fi
            fi
          fi
          echo "already_deployed=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH key
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STOREFRONT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STOREFRONT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Detect inactive color
        if: steps.idempotency.outputs.already_deployed != 'true'
        id: color
        run: |
          # Query the intended active color from /etc/default/caddy on the VPS
          # (source of truth for Caddy reloads). The active color is set via
          # STOREFRONT_ACTIVE_COLOR env var (blue|green).
          # Caddyfile defaults to blue when unset, so on first deploy (empty/missing)
          # the active color is blue → deploy to green.
          # Empty RESULT from grep (first deploy) is OK — treated as blue.
          COLOR="blue"
          RESULT=$(ssh "root@${{ secrets.STOREFRONT_SSH_HOST }}" "grep '^STOREFRONT_ACTIVE_COLOR=' /etc/default/caddy 2>/dev/null | cut -d= -f2" || RESULT="")
          if [ "$RESULT" = "green" ]; then
            COLOR="blue"
          elif [ "$RESULT" = "blue" ] || [ -z "$RESULT" ]; then
            COLOR="green"
          else
            echo "::error::Unexpected active color: '$RESULT' (expected blue|green)" >&2
            exit 1
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Deploying to inactive color: $COLOR"

      - name: Deploy storefront to VPS
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          STOREFRONT_SSH="root@${{ secrets.STOREFRONT_SSH_HOST }}" \
          STOREFRONT_ROOT="${{ secrets.STOREFRONT_ROOT }}" \
          ./backend/scripts/deploy-storefront.sh --color=${{ steps.color.outputs.color }} --promote
        env:
          API_BASE: https://api.compmasone.ru/api
          SITE_URL: https://www.compmasone.ru

      - name: Create GitHub Release
        if: github.event_name != 'release' && steps.idempotency.outputs.already_deployed != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Deployment (production)
        if: steps.idempotency.outputs.already_deployed != 'true'
        uses: bobheadxi/deployments@18dcfe705d6892121d665b21ef9ff448791807f3
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          auto-merge: false

      - name: Update Deployment Status (success)
        if: success() && steps.idempotency.outputs.already_deployed != 'true'
        uses: bobheadxi/deployments@18dcfe705d6892121d665b21ef9ff448791807f3
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          status: success
          deployment-url: https://www.compmasone.ru

      - name: Update Deployment Status (failure)
        if: failure() && steps.idempotency.outputs.already_deployed != 'true'
        uses: bobheadxi/deployments@18dcfe705d6892121d665b21ef9ff448791807f3
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production-vps
          ref: ${{ github.sha }}
          status: failure

      - name: Emit deployment metric
        if: always() && steps.idempotency.outputs.already_deployed != 'true'
        run: |
          STATUS="${{ job.status }}"
          START_TIME=${DEPLOY_START_TIME:-$(date +%s)}
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "::notice title=Deploy Finished::deployment_id=${{ env.DEPLOYMENT_ID }} status=$STATUS duration_seconds=$DURATION"