name: Deploy Production

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy-production:
    # Uses Vercel's auto-created "Production" environment
    environment: Production
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Tag $TAG does not match semantic version format vX.Y.Z"
            exit 1
          fi
          echo "Deploying version: $TAG"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STOREFRONT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STOREFRONT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy storefront to VPS
        run: |
          STOREFRONT_SSH="root@${{ secrets.STOREFRONT_SSH_HOST }}" \
          STOREFRONT_ROOT="${{ secrets.STOREFRONT_ROOT }}" \
          ./backend/scripts/deploy-storefront.sh --skip-build
        env:
          API_BASE: https://api.compmasone.ru/api
          SITE_URL: https://www.compmasone.ru

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Deployment (production)
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production
          ref: ${{ github.sha }}
          auto-merge: false

      - name: Update Deployment Status (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production
          ref: ${{ github.sha }}
          status: success
          deployment-url: https://www.compmasone.ru

      - name: Update Deployment Status (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production
          ref: ${{ github.sha }}
          status: failure