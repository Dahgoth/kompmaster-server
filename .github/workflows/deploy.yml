name: Deploy Production

on:
  # `push: tags` never fires for this repository: release-please creates the
  # tag through the GitHub API, and an API-created tag ref emits no `push`
  # event. Verified on v2.4.2 and v2.4.3 — both tagged and released, zero
  # deploy runs created. The tag is therefore not a usable trigger here.
  #
  # `workflow_dispatch` is the trigger release.yml uses, dispatched with
  # `--ref <tag>` so the run's ref is the tag, which is what the production-vps
  # environment policy (type: tag, v*.*.*) requires. Dispatching on the default
  # branch instead would carry ref=main and be rejected by the gate - that is
  # the observed behaviour of the only dispatch run this repo has.
  #
  # `release: published` was removed deliberately. No run with `event=release`
  # has ever been created in this repository, so it contributed nothing, and
  # keeping it would mean a second initiator for the same commit - the overlap
  # the concurrency group below can only serialise, not prevent.
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  deploy-production:
    # The idempotency guard below is check-then-act: it reads the Deployments
    # API and then deploys. Two triggers firing for the same commit (a manual
    # `git push origin vX.Y.Z` while a release is also published, or a retry
    # alongside the release dispatch) would both read "not deployed" and both
    # deploy, racing on the same colour directory. The guard prevents a
    # *sequential* double deploy; this prevents a *concurrent* one.
    #
    # Keyed on the head SHA, so different releases still deploy in parallel and
    # only runs for the same commit serialise.
    #
    # Scope of the guarantee: GitHub keeps ONE running plus ONE pending job per
    # group, and a third concurrent run cancels the pending one regardless of
    # cancel-in-progress. So this bounds a same-commit overlap to two runs -
    # the second then hits the idempotency guard after the first has recorded
    # success, which is the one behaviour that guard is actually good for. It
    # does not eliminate the overlap outright; `release: published` was removed
    # so that in practice only one initiator exists per release.
    concurrency:
      group: deploy-production-${{ github.sha }}
      cancel-in-progress: false
    # Custom GitHub Environment for VPS production deploy (not Vercel's "Production")
    # Create in GitHub Settings → Environments → production-vps
    # Add secrets: STOREFRONT_SSH_KEY, STOREFRONT_SSH_HOST, STOREFRONT_ROOT
    # Protection rules: required reviewers (1), wait timer: 0 (removed - health gates handle safety)
    environment: production-vps
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Extract and validate tag
        uses: ./.github/actions/extract-tag
        id: extract
        with:
          tag: ${{ inputs.tag }}

      - name: Generate correlation ID
        run: |
          echo "DEPLOYMENT_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "DEPLOY_START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "::notice title=Deploy Started::deployment_id=${{ env.DEPLOYMENT_ID }} tag=${{ steps.extract.outputs.tag }} runner=${{ runner.name }}"

      - name: Check if already deployed (idempotency guard)
        id: idempotency
        run: |
          # Check for successful deployment instead of just release existence
          # Resolve tag to commit SHA for consistent deployment lookup across all triggers
            # Do NOT fold stderr into the substitution: `2>&1` inside $(...)
            # captures the message into TAG_COMMIT, which is then overwritten,
            # leaving only a generic error. That is what hid the v2.4.4 failure -
            # gh was not installed and the only clue was a generic message.
            if ! TAG_COMMIT=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.extract.outputs.tag }}" --jq '.object.sha' 2>tag_err.txt); then
              echo "::error::Failed to resolve tag commit SHA for ${{ steps.extract.outputs.tag }}:" >&2
              cat tag_err.txt >&2
              exit 1
            fi
          # Query GitHub Deployments API for successful deployment in production-vps
          DEPLOYMENTS=$(gh api repos/${{ github.repository }}/deployments --jq '.[] | select(.environment=="production-vps" and .ref=="'"$TAG_COMMIT"'")' 2>/dev/null)
          if [ -n "$DEPLOYMENTS" ]; then
            # Get the latest deployment ID (most recent first)
            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r '.id' | head -1)
            if [ -n "$DEPLOYMENT_ID" ] && [ "$DEPLOYMENT_ID" != "null" ]; then
              # Get latest status (sort by created_at, take last)
              STATUS=$(gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses --jq 'sort_by(.created_at) | last | .state' 2>/dev/null)
              if [ "$STATUS" = "success" ]; then
                echo "already_deployed=true" >> $GITHUB_OUTPUT
                echo "Deployment already successful — skipping"
                exit 0
              fi
            fi
          fi
          echo "already_deployed=false" >> $GITHUB_OUTPUT
          echo "TAG_COMMIT=$TAG_COMMIT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH key
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STOREFRONT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STOREFRONT_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Detect inactive color
        if: steps.idempotency.outputs.already_deployed != 'true'
        id: color
        run: |
          # Query the intended active color from /etc/default/caddy on the VPS
          # (source of truth for Caddy reloads). The active color is set via
          # STOREFRONT_ACTIVE_COLOR env var (blue|green).
          # Caddyfile defaults to blue when unset, so on first deploy (empty/missing)
          # the active color is blue → deploy to green.
          # Empty RESULT from grep (first deploy) is OK — treated as blue.
          COLOR="blue"
          # Use explicit error sentinel to distinguish SSH failure from empty result
          RESULT=$(ssh -o BatchMode=yes -o ConnectTimeout=10 "root@${{ secrets.STOREFRONT_SSH_HOST }}" "grep '^STOREFRONT_ACTIVE_COLOR=' /etc/default/caddy 2>/dev/null | cut -d= -f2" 2>/dev/null || RESULT="__ERROR__")
          if [ "$RESULT" = "__ERROR__" ]; then
            echo "::error::Failed to query active color via SSH"
            exit 1
          fi
          if [ "$RESULT" = "green" ]; then
            COLOR="blue"
          elif [ "$RESULT" = "blue" ] || [ -z "$RESULT" ]; then
            COLOR="green"
          else
            echo "::error::Unexpected active color: '$RESULT' (expected blue|green)" >&2
            exit 1
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "Deploying to inactive color: $COLOR"

      - name: Deploy storefront to VPS
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          STOREFRONT_SSH="root@${{ secrets.STOREFRONT_SSH_HOST }}" \
          STOREFRONT_ROOT="${{ secrets.STOREFRONT_ROOT }}" \
          ./backend/scripts/deploy-storefront.sh --color=${{ steps.color.outputs.color }} --promote
        env:
          API_BASE: https://api.compmasone.ru/api
          SITE_URL: https://www.compmasone.ru

      # softprops/action-gh-release and bobheadxi/deployments are not permitted
      # by the repository's action policy (owned by Dahgoth, created by GitHub,
      # or Marketplace-verified only). Replaced with the `gh` CLI, which is
      # preinstalled on GitHub runners and already used by the idempotency
      # guard above — same Deployments REST API, no third-party dependency.

      - name: Create GitHub Release
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          # Distinguish "release does not exist" (create it) from a real failure
          # such as auth, rate limiting or a network blip. `gh release view`
          # exits non-zero for both, so the message is what separates them —
          # without this, an auth failure would be reported as "release missing"
          # and then fail again on create with the original error buried.
          if gh release view "$TAG" >/dev/null 2>view_err.txt; then
            echo "Release $TAG already exists — leaving it untouched"
          elif grep -qi "not found" view_err.txt; then
            # No --title: --generate-notes auto-generates BOTH the release name
            # and body from the commits, matching the previous
            # generate_release_notes: true behaviour.
            gh release create "$TAG" --verify-tag --generate-notes
          else
            echo "::error::gh release view failed for $TAG — not a missing release:"
            cat view_err.txt
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read the tag from the extract-tag step's declared output rather than
          # the `TAG` env var. Both work — extract-tag writes `TAG` to
          # $GITHUB_ENV — but the idempotency guard above already reads
          # `steps.extract.outputs.tag`, and using the same source in both
          # places keeps the data flow visible in the YAML instead of an
          # invisible GITHUB_ENV side channel.
          TAG: ${{ steps.extract.outputs.tag }}

      - name: Create GitHub Deployment (production)
        id: deployment
        if: steps.idempotency.outputs.already_deployed != 'true'
        run: |
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::TAG_COMMIT is empty; cannot create deployment" >&2
            exit 1
          fi
          DEPLOYMENT_ID=$(gh api --method POST "repos/${{ github.repository }}/deployments" \
            --input - --jq '.id' <<JSON
          {
            "ref": "$TAG_COMMIT",
            "environment": "production-vps",
            "auto_merge": false,
            "required_contexts": []
          }
          JSON
          )
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Created deployment $DEPLOYMENT_ID for $TAG_COMMIT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_COMMIT: ${{ steps.idempotency.outputs.TAG_COMMIT }}

      - name: Update Deployment Status (success)
        if: >-
          success() &&
          steps.idempotency.outputs.already_deployed != 'true' &&
          steps.deployment.outputs.id != ''
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=success \
            -f environment=production-vps \
            -f log_url=https://www.compmasone.ru \
            -f description="Storefront deployed" \
            --jq '.state'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Deployment Status (failure)
        if: >-
          failure() &&
          steps.idempotency.outputs.already_deployed != 'true' &&
          steps.deployment.outputs.id != ''
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f environment=production-vps \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Storefront deploy failed" \
            --jq '.state'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit deployment metric
        if: always() && steps.idempotency.outputs.already_deployed != 'true'
        run: |
          STATUS="${{ job.status }}"
          START_TIME=${DEPLOY_START_TIME}
          if [ -z "$START_TIME" ]; then
            echo "::warning::DEPLOY_START_TIME not set, cannot calculate duration"
            START_TIME=$(date +%s)
          fi
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "::notice title=Deploy Finished::deployment_id=${{ env.DEPLOYMENT_ID }} status=$STATUS duration_seconds=$DURATION"