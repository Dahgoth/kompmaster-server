name: SLSA Provenance

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the artifact to sign'
        required: true
        type: string
      tag:
        description: 'Tag for the release'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  generate-provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: pnpm --filter kompmaster-frontend build
        env:
          API_BASE: https://api.compmasone.ru/api
          SITE_URL: https://www.compmasone.ru

      - name: Generate SLSA Provenance
        uses: slsa-framework/slsa-github-generator@1.9.0
        with:
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: frontend/.next/standalone
          provenance-name: ${{ inputs.artifact-name }}-provenance.intoto.jsonl
          upload-assets: true
          builder-id: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v1.9.0