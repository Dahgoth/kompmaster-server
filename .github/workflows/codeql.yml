name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `javascript` and `typescript` are ONE CodeQL extractor, not two —
        # they are documented alternative identifiers for `javascript-typescript`.
        # Listing them separately made the matrix request the same language
        # twice, and every run since this workflow was added failed at startup
        # (`startup_failure`, "likely failed because of a workflow file issue").
        #
        # `actions` scans the workflow files themselves, which is worth having
        # given the deploy pipeline is entirely workflow-driven.
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # No `queries:` key, so CodeQL runs the default high-precision
          # `security` suite. `security-extended` adds lower-precision
          # queries and `security-and-quality` adds maintainability results
          # on top; both trade signal for volume, which is the wrong trade for
          # a single reviewer. Opt in later via a reviewed PR if triage proves
          # the default suite too quiet.

      # No `autobuild`: it exists for compiled languages, and neither
      # JavaScript/TypeScript nor Actions analysis needs a build mode.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
