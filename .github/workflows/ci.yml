name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # Always runs: cheap guard that the docs-in-sync hard rule holds for the
  # pushed change set (AGENTS.md §6). Scopes itself via `git diff`, so it
  # costs ~1s and never needs path filters.
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Docs-in-sync check
        run: |
          # The rule is PR-scoped ("update the doc in the same pull request"),
          # so always diff against the merge-base with main — NOT
          # github.event.before, which on a push event only covers the latest
          # push and would re-demand docs that an earlier commit on this
          # branch already updated.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # checkout@v4 with fetch-depth: 0 already fetched all branches;
            # only re-fetch if origin/main is somehow missing.
            base=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
            if [ -z "$base" ]; then
              git fetch --no-tags origin main
              base=$(git merge-base HEAD origin/main)
            fi
          fi
          echo "docs-sync base: $base"
          node scripts/check-docs.js --base "$base"

  # Always runs: the workspace root package.json#version is the single source
  # of truth and both apps must match it (ADR 003). Pure Node — no install.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shared version guard
        run: node scripts/check-versions.js

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint:commit

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docker-compose.yml'
              - 'Caddyfile'
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.backend == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.backend == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.backend == 'true'
      - name: Syntax check (backend JS files in this change set)
        if: steps.changes.outputs.backend == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
            if [ -z "$base" ]; then
              git fetch --no-tags origin main
              base=$(git merge-base HEAD origin/main)
            fi
          fi
          # Only syntax-check backend JS files whose *content* changed. A full
          # diff with rename detection lets git pair `git mv src/ backend/src/`
          # renames, so `--diff-filter=AM` leaves pure renames out. The backend
          # package is CommonJS and a few pre-existing legacy files use ESM
          # syntax (ADR 001 legacy quarantine), which `node --check` rejects
          # even though this change did not touch their content.
          files=$(git diff -M --diff-filter=AM --name-only "$base"...HEAD \
            | grep -E '^backend/(src|tests|scripts)/.*\.js$' || true)
          if [ -n "$files" ]; then
            for f in $files; do node --check "$f"; done
          else
            echo "no backend JS content changes to check."
          fi
      - run: pnpm --filter kompmaster-server test
        if: steps.changes.outputs.backend == 'true'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '!frontend/terraform/**'
              - 'DESIGN.md'
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.frontend == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.frontend == 'true'
      - run: pnpm --filter kompmaster-frontend test
        if: steps.changes.outputs.frontend == 'true'
      - run: pnpm --filter kompmaster-frontend run build
        if: steps.changes.outputs.frontend == 'true'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - 'frontend/terraform/**'
      - name: Terraform placeholder
        if: steps.changes.outputs.terraform == 'true'
        run: |
          echo "terraform/ changes detected but no .tf files exist yet."
          echo "See terraform/README.md — add fmt/validate/tflint here when infra lands."
          test -z "$(git ls-files 'terraform/**/*.tf' 'frontend/terraform/**/*.tf')"
