name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: kompmaster-server
          changelog-types: |
            [{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"docs","section":"Documentation","hidden":false},{"type":"refactor","section":"Refactors","hidden":false},{"type":"perf","section":"Performance","hidden":false},{"type":"test","section":"Tests","hidden":false},{"type":"build","section":"Build System","hidden":false},{"type":"ci","section":"CI","hidden":false},{"type":"chore","section":"Chores","hidden":true},{"type":"revert","section":"Reverts","hidden":false}]
          # release-please creates/updates a Release PR on each push to main.
          # When the Release PR is merged (squash-merge), it creates the GitHub Release + tag.
          # The Release PR itself contains the version bump commits for root, backend, frontend.

# Version sync (root → backend/frontend) is handled by the Release PR commits.
# When the Release PR is merged, the tag triggers the deploy-production workflow.