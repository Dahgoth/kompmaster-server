name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  deployments: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    # Exposed so the sibling `deploy` job can consume them. A job that calls
    # another workflow must sit at JOB level, so it cannot read this job's
    # steps directly.
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please now bumps backend/ and frontend/ package.json in the
      # release PR itself (see .release-please-config.json), so there is
      # nothing to sync after the fact — and nothing that needs a direct push
      # to main, which the branch ruleset rejects anyway.
      #
      # This is a verification, not a repair. If it fails, the release PR was
      # merged with the packages out of step, and that is worth stopping for
      # rather than papering over with a commit that bypasses review.
      - name: Verify version alignment
        if: steps.release.outputs.release_created == 'true'
        run: node scripts/check-versions.js

  # Reusable workflows are called at the JOB level, never from a step.
  # GitHub rejects the entire workflow file when `uses: ./.github/workflows/...`
  # appears inside `steps`.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
