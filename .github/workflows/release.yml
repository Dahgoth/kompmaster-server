name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  deployments: write
  actions: write   # required by the workflow_dispatch API (gh workflow run)

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please creates the tag through the GitHub API, and an API-created
      # tag ref emits no `push` event — so deploy.yml's `push: tags` trigger never
      # fired. Verified on v2.4.2 and v2.4.3: both were tagged and released, and
      # ZERO deploy runs were created. A `release: published` trigger does not fix
      # it either; no run with `event=release` has ever been created here.
      #
      # Dispatching with `--ref <tag>` makes the new run's ref the tag itself,
      # which is what the production-vps environment policy (type: tag, v*.*.*)
      # requires. Pushing the tag over git does NOT work: the ref already exists
      # remotely, so the push is "Everything up-to-date", updates nothing and
      # fires no event. skip-github-release has the same flaw — it suppresses the
      # Release object but not the tag.
      #
      # `gh workflow run` returns as soon as the run is queued, so this step
      # cannot see a later failure. The deploy run is the thing to watch; a
      # failure there will not turn this job red.
      - name: Trigger the production deploy for the new tag
        if: steps.release.outputs.release_created == 'true'
        run: |
          set -eu
          TAG="${{ steps.release.outputs.tag_name }}"
          gh workflow run deploy.yml --ref "$TAG"
          echo "dispatched deploy.yml on ${TAG} — watch that run for the outcome"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-please creates the tag through the GitHub API, and an API-created
      # tag ref emits no `push` event — so `deploy.yml`'s `push: tags` trigger
      # never fired. Verified on v2.4.2 and v2.4.3: both were tagged and
      # released, and ZERO deploy runs were created. A `release: published`
      # trigger does not fix it either; no run with `event=release` has ever
      # been created in this repository.
      #
