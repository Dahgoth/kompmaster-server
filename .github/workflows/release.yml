name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync versions
        if: steps.release.outputs.release_created == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run version:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# release-please with monorepo manifest manages version for all three packages:
# root (kompmaster), backend (kompmaster-server), frontend (kompmaster-frontend)
# When Release PR is merged (merge commit), it creates GitHub Release + tag + version bumps in manifest.
#
# The Release PR contains version bumps for all packages in the manifest.
# When merged (merge commit), it creates the GitHub Release + tag.
# The tag push triggers deploy.yml naturally via its `on: push: tags` trigger.