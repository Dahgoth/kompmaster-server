# pnpm workspace root for the KompMaster monorepo.
#
# Settings live here (pnpm >= 11 does not read a `pnpm` field from
# package.json). The single root pnpm-lock.yaml covers both packages.
packages:
  - backend
  - frontend

# esbuild (a Vite transitive dependency) ships a native binary via a
# postinstall script. pnpm blocks dependency build scripts by default, so
# approve exactly this one package instead of opening the installer up.
# (msw needs no build script: its postinstall only prints a message.)
allowBuilds:
  esbuild: true
  msw: true

# npm-style flat node_modules (real directories, not store symlinks). Required
# by the storefront deploy: with the default isolated layout, `next build`'s
# standalone trace emits `next` as a ~300KB stub in `.next/node_modules` with
# `standalone/node_modules` symlinked into it, so the bundle Next.js docs call
# "deployable" cannot boot outside the build tree (missing lazily-required
# files: `require("./cpu-profile")` is the first casualty). With hoisted
# linking the standalone output is self-contained and rsync-able
# (backend/scripts/deploy-storefront.sh, DEPLOY.md §8).
nodeLinker: hoisted
